<div
    class="icon-container"
    [style]="iconColorStyles()"
>
    <tui-icon [icon]="formValue().icon" />
</div>

<form
    [attr.id]="formId"
    [formGroup]="form"
    (ngSubmit)="save($event)"
>
    <tui-textfield>
        <label
            for=""
            tuiLabel
        >
            Diary name
        </label>
        <input
            formControlName="name"
            tuiAutoFocus
            tuiTextfield
            type="text"
        />
    </tui-textfield>

    <div class="color-picker">
        @for (color of predefinedColors; track color) {
            <button
                type="button"
                class="color-picker-btn"
                [class.active]="formValue().accentColor === color"
                (click)="pickColor(color)"
            >
                <div
                    class="color-circle"
                    [style.--color]="color"
                ></div>
            </button>
        }
    </div>

    <div>
        @for (icon of icons; track $index) {
            <button
                type="button"
                appearance="flat-grayscale"
                size="m"
                tuiIconButton
                [iconStart]="icon"
                [tuiAppearanceState]="formValue().icon === icon ? 'hover' : null"
                (click)="pickIcon(icon)"
            ></button>
        }
    </div>
</form>

<footer>
    <button
        size="m"
        tuiButton
        type="submit"
        [attr.form]="formId"
    >
        {{ isEdit ? "Save" : "Create" }}
    </button>
</footer>
