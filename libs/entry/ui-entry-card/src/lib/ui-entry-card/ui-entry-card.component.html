    <a
        class="entry-link"
        [routerLink]="entryLink()"
    >
        @if (entry().title) {
            <h4 class="entry-title">{{ entry().title }}</h4>
        }
        <div
            class="entry-content"
            [innerHTML]="content()"
        ></div>
    </a>

    <footer class="footer">
        <time [attr.datetime]="createDate()">{{ createDateFormatted() }}</time>

        <button
            appearance="flat-grayscale"
            iconStart="ellipsis"
            size="s"
            tuiDropdownOpen
            tuiIconButton
            type="button"
            [tuiDropdown]="menu"
        >
            <ng-template #menu>
                <tui-data-list size="s">
                    <button
                        iconStart="bookmark"
                        new
                        tuiOption
                        type="button"
                        (click)="markAsBookmarked()"
                    >
                        Add Bookmark
                    </button>
                    <button
                        iconStart="trash"
                        new
                        tuiAppearance="flat-destructive"
                        tuiOption
                        type="button"
                        (click)="markAsDeleted()"
                    >
                        Delete
                    </button>
                </tui-data-list>
            </ng-template>
        </button>
    </footer>
</article>
