<form
    tuiAppearance="floating"
    tuiCardLarge
    tuiForm="m"
    [formGroup]="form"
    (submit.prevent)="logIn()"
>
    <header tuiHeader>
        <h2 tuiTitle>Login</h2>
    </header>
    <tui-textfield>
        <label tuiLabel>Email</label>
        <input
            formControlName="email"
            placeholder="name@domain.com"
            tuiTextfield
            type="email"
            autocomplete="email"
        />
    </tui-textfield>
    <tui-error
        formControlName="email"
        [error]="[] | tuiFieldError | async"
    />
    <tui-textfield>
        <label tuiLabel>Password</label>
        <input
            formControlName="password"
            tuiTextfield
            type="password"
            autocomplete="password"
        />
    </tui-textfield>
    <tui-error
        formControlName="password"
        [error]="[] | tuiFieldError | async"
    />
    <tui-radio-list
        [formControl]="serverType"
        [items]="serverTypes"
        size="s"
    />

    @if (serverTypeValue() === 'selfHosted') {
        <tui-textfield size="m" class="server-url-textfield">
            <label tuiLabel>Server URL</label>
            <input
                [formControl]="selfhostedServerUrl"
                tuiTextfield
                type="url"
                autocomplete="url"
                placeholder="https://yourserver.com"
            />
        </tui-textfield>
        <tui-error
            [formControl]="selfhostedServerUrl"
            [error]="[] | tuiFieldError | async"
        />
    }
    <footer>
        <a
            [routerLink]="registerUrl"
            tuiLink
        >
            Register
        </a>

        <button
            tuiButton
            type="submit"
        >
            Log in
        </button>
    </footer>
</form>
